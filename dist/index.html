<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1717">
  <meta name="description" content="扮演张謇，在晚清与民国的时代变局中选择实业、教育与政治道路。沿史实走完一生，或探索另一种可能。">
  <title>一生一城 · 张謇人生游戏</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230b1717'/%3E%3Cpath d='M14 19h36M19 13v37h26V13M14 31h36M25 41h14' stroke='%23d0ac75' stroke-width='4' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#story-title">跳到人生选择</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="一生一城首页"><span class="seal">謇</span><span>一生一城<small>张謇人生游戏</small></span></a>
    <span class="header-note">江海之间，写下你的一生。</span>
    <nav aria-label="游戏工具"><button type="button" data-action="atlas">人生图谱</button><button type="button" data-action="sources">史料与说明</button><button type="button" data-action="fullscreen">全屏</button><button type="button" data-action="restart" class="restart">重新开始</button></nav>
  </header>
  <main class="shell">
    <aside class="sidebar" aria-label="人物与人生状态">
      <div class="identity"><span class="eyebrow">主角</span><h1>张謇</h1><p>1853—1926</p></div>
      <section class="stat-block" aria-label="人生的四种分量"><div id="stats"></div></section>
      <section class="route-block" aria-label="此刻的道路"><p id="route-name">史实主线</p><p id="route-note">本机自动存档</p></section>
    </aside>
    <div class="game-column">
      <div class="chapter-strip"><span id="chapter-label">第一卷 · 状元转身</span><span id="progress-label">人生节点 01</span></div>
      <article id="game" aria-labelledby="story-title"></article>
      <section class="history-strip" aria-label="已走过的人生"><span class="eyebrow">你的足迹</span><div id="trail"></div></section>
      <footer class="game-footer"><span>人生没有标准答案，史实有可查的出处。数值仅代表游戏状态。</span><span>选择 1 / 2 / 3 · 继续 Enter</span></footer>
    </div>
  </main>
  <dialog id="modal"><div class="modal-header"><h2 id="modal-title"></h2><button class="icon-button" data-action="close" aria-label="关闭">×</button></div><div id="modal-body"></div></dialog>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
